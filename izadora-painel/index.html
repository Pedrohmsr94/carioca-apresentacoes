<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Izadora Tannus</title>
<meta name="description" content="Protótipo do painel de gestão do escritório, com dados fictícios.">
<meta name="theme-color" content="#0F1F2E">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
</head>
<body>
<!--
THESIS: O painel abre no dia dela, não num quadro de números. A agenda corre na vertical e, ao lado, só o que pede ação: intimação, parcela vencida, gente esperando e a esteira (revisão de 1 ano, testamento depois do pacto). Recusa o dashboard de cartões com métrica grande.
OWN-WORLD: menu lateral em marinho #0F1F2E com o logo e o wordmark em EB Garamond espaçado; mesa em creme #F3EEE7 com folhas #FBF8F3 separadas por linha de 1px; coral #E8846B só em ponto, linha do "agora" e botão principal; cobre #7A5C3E em rótulo e número; Figtree na interface, Bricolage só na manchete do dia.
STORY: Ela entende em cinco segundos o que tem hoje, resolve cada item ali mesmo (prazo, baixa, resposta) e percebe que o painel lembra do próximo serviço de cada família.
FIRST VIEWPORT: manchete com o dia e uma frase-resumo no alto; à esquerda a linha do tempo de hoje com a linha coral do agora; à direita o trilho "o que pede você"; o guia "Experimente" no canto.
FORM: "O dia como mesa", estrutura 1 da lista ordenada, chave 4773d7fc.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="app">
  <aside class="lateral" aria-label="Menu">
    <a class="marca" href="#hoje" aria-label="Izadora Tannus, início">
      <img src="assets/logo.png" alt="" width="40" height="32">
      <span class="marca__nome">Izadora Tannus</span>
      <span class="marca__sub">Advocacia de família</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <section class="guia guia--lateral" id="guia-lateral" aria-label="Experimente o painel"></section>
    <div class="lateral__pe">
      <p class="lateral__djen" id="djen-status"></p>
      <button class="lateral__reset" type="button" data-acao="restaurar">Restaurar dados de exemplo</button>
    </div>
  </aside>

  <div class="principal">
    <div class="aviso-demo" role="note">
      <span><b>Protótipo.</b> Todos os nomes e números são fictícios. O que você mexer fica só neste navegador.</span>
      <button type="button" class="aviso-demo__btn" data-acao="restaurar">Restaurar exemplo</button>
    </div>
    <main id="tela" class="tela" tabindex="-1"></main>
  </div>

  <nav class="barra-movel" id="barra-movel" aria-label="Menu"></nav>
</div>

<dialog class="folha" id="folha" aria-labelledby="folha-titulo">
  <div class="folha__topo">
    <h2 id="folha-titulo" class="folha__titulo"></h2>
    <button type="button" class="icone-btn" data-acao="fechar-folha" aria-label="Fechar"></button>
  </div>
  <div class="folha__corpo" id="folha-corpo"></div>
</dialog>

<aside class="guia guia--movel" id="guia" aria-label="Experimente o painel"></aside>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="dados.js"></script>
<script src="painel.js"></script>
</body>
</html>
